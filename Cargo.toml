[package]
name = "sage-engine-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Open Sage backgammon engine as a Backgammon Engine Protocol stdio daemon"

[dependencies]
bep-protocol = { git = "https://github.com/customation/backgammon-engine-protocol", branch = "main" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
