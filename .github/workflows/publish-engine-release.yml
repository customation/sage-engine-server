name: Publish engine release

# Builds Open Sage as a downloadable engine release and publishes it where
# GammonBase Desktop looks for it: gammonbase.com/engines/catalogue.json, which
# the site COMPOSES from the objects this workflow uploads. Nothing rewrites a
# shared catalogue file, so two engines releasing at the same moment cannot race.
#
# What lands in the assets bucket, per platform:
#   engines/sage/identity.json                                  who this engine is
#   engines/sage/<version>/<platform>/release.json              how to install and run it
#   engines/sage/<version>/<platform>/sage-<platform>.zip       the engine itself
#
# REQUIREMENTS before this can run green:
#   * customation/backgammon-engine-protocol must exist — Cargo.toml depends on
#     it by git URL, and cargo cannot fetch a repository that is not there.
#   * Two GitHub secrets, the same pair the gammonbase site's release workflow
#     uses: SCW_OBJECT_STORAGE_ACCESS_KEY / SCW_OBJECT_STORAGE_SECRET_KEY
#     (a Scaleway IAM key with ObjectStorage write on the project).
# customation/bgsage is public, so the engine core needs no token.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semantic, e.g. 0.3.1)'
        required: true
  push:
    tags:
      - 'v*'

env:
  # The id the catalogue and every installed copy know this engine by. Changing
  # it would orphan every install, so it is fixed here and nowhere else.
  ENGINE_ID: sage
  # Must match the site's ObjectStorage config and DownloadsController's bucket.
  S3_ENDPOINT: https://s3.fr-par.scw.cloud
  S3_BUCKET: gammonbase-assets-prod
  # EngineCatalogueService composes the catalogue from exactly this prefix.
  ENGINES_PREFIX: engines

jobs:
  publish:
    strategy:
      # One job per published platform, and NOT fail-fast: a broken Linux build
      # should not withdraw a working Windows release.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            exe: sage-engine-server.exe
            capi: bgsage_capi.dll
            capi_built: build/Release/bgsage_capi.dll
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: sage-engine-server
            capi: libbgsage_capi.so
            capi_built: build/libbgsage_capi.so
          # ARM64. Nothing in bgsage needed changing for this: neural_net.cpp
          # already selects a NEON path from __aarch64__, and cpp/capi's CMake
          # already withholds -mavx2/-mfma on arm64. This entry is what proves it
          # — the same source, the same NEON code an Apple Silicon build will
          # take, compiled and smoke-tested on hardware GitHub gives us for free.
          # If it goes green, macos-aarch64 is a runner label away once the Apple
          # account exists; if it does not, we learn that now rather than while
          # waiting on Apple.
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            exe: sage-engine-server
            capi: libbgsage_capi.so
            capi_built: build/libbgsage_capi.so
          # macOS. Proven by verify-macos-build.yml before these rows existed:
          # both architectures compile and pass the full e2e, including the
          # numeric parity the NEON sigmoid fix bought.
          #
          # Nothing needs bundling alongside. cpp/capi links Threads::Threads and
          # libc++ and nothing else, both of which are part of the system on
          # macOS — unlike gnubg, whose library pulls in Homebrew's glib, gettext
          # and gmp by absolute path and cannot ship until those travel with it.
          - os: macos-latest
            platform: macos-aarch64
            exe: sage-engine-server
            capi: libbgsage_capi.dylib
            capi_built: build/libbgsage_capi.dylib
          - os: macos-15-intel
            platform: macos-x86_64
            exe: sage-engine-server
            capi: libbgsage_capi.dylib
            capi_built: build/libbgsage_capi.dylib
    runs-on: ${{ matrix.os }}
    # The Apple signing credentials are secrets of this environment rather than
    # of the repository, so they can only be read from main or a v* tag. This
    # repository is PUBLIC: a repository-level signing secret would be readable
    # by any workflow on any branch a collaborator can push. Losing a signing
    # credential is not a rotation — it is a revoked certificate and malware
    # signed in our name.
    environment: release
    defaults:
      run:
        # Git Bash on the Windows runner, so one script serves both platforms.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # The engine core: the C API shim, the weights and the bearoff database.
      # Public repository, so no token.
      #
      # The `gbase` branch, NOT the default one: `cpp/capi` — the standalone
      # CPU-only build of the C API this daemon loads — exists only there. A
      # checkout of `main` produces a tree with no capi to build, which is
      # exactly how the first run of this workflow failed.
      - name: Check out the engine core
        uses: actions/checkout@v4
        with:
          repository: customation/bgsage
          ref: gbase
          path: bgsage

      - name: Resolve the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          # The desktop app orders releases by SEMANTIC version — "0.10.0" is
          # newer than "0.9.0", which text ordering gets backwards — and reports
          # a version it cannot parse instead of guessing. Refuse it here, where
          # it is one line to fix, rather than in everyone's Settings screen.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $ENGINE_ID $VERSION for ${{ matrix.platform }}"

      - uses: dtolnay/rust-toolchain@stable

      # CPU-only, self-contained CMake project (bgsage/cpp/capi) — no CUDA, no
      # pybind11. The default generator is used on purpose: Ninja would need the
      # MSVC developer environment set up first.
      - name: Build the engine core
        run: |
          cmake -S bgsage/cpp/capi -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          test -f "${{ matrix.capi_built }}" || { echo "::error::${{ matrix.capi_built }} was not produced"; exit 1; }

      - name: Build the daemon
        run: cargo build --release

      # Level resolution, notation and cube-decision parity. Cheap, and they
      # reuse the release artifacts just compiled.
      - name: Unit tests
        run: cargo test --release

      # The layout the daemon resolves by default, RELATIVE TO ITS OWN
      # EXECUTABLE (see build_pool in src/main.rs) — so the release needs no
      # arguments at all, and the app spawns it with none.
      - name: Assemble the release
        run: |
          STAGE="stage/$ENGINE_ID"
          mkdir -p "$STAGE/models" "$STAGE/data"
          cp "target/release/${{ matrix.exe }}" "$STAGE/"
          cp "${{ matrix.capi_built }}" "$STAGE/${{ matrix.capi }}"
          # The stage9 model set the daemon serves; nothing else from models/.
          cp bgsage/models/sl_s9_*.weights.best "$STAGE/models/"
          cp bgsage/data/bearoff_1sided.db "$STAGE/data/"
          echo "Staged:"; find "$STAGE" -type f | wc -l; du -sh "$STAGE"

      # macOS only. Signing happens BEFORE the e2e below, so what gets exercised
      # is the artefact that ships, Hardened Runtime and all — not an unsigned
      # near-copy of it.
      #
      # Every Mach-O is signed, not just the executable: a signed daemon next to
      # an unsigned library is not a signed product, and on Apple Silicon
      # unsigned code does not run at all.
      #
      # Unlike SSL.com's eSigner on the Windows side, there is no cloud HSM for
      # Developer ID — the private key genuinely lands on the runner. It goes
      # into a keychain created for this job and destroyed with it, and the
      # decoded .p12 is removed as soon as it is imported.
      - name: Sign for macOS
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # The value the Apple secrets held between being created and the
          # certificate existing. A placeholder that merely LOOKS configured is
          # worse than no value: "is it set" passes, and the run spends ten
          # minutes building before dying at an unhelpful signing error. This
          # check knows the string by name. Keep it — secrets get recreated.
          APPLE_PLACEHOLDER: PLACEHOLDER-SET-FROM-THE-APPLE-DEVELOPER-ACCOUNT
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set on the 'release' environment."
              exit 1
            fi
            if [ "$value" = "$APPLE_PLACEHOLDER" ]; then
              echo "::error::$name is still the placeholder — the Apple credentials were never filled in."
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -f pkcs12
          rm -f "$CERT"

          # Without this, codesign blocks on a GUI prompt for keychain access
          # that nobody can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Search order, not replacement: the system keychain still has to be
          # reachable for the Apple intermediates.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          STAGE="stage/$ENGINE_ID"
          for file in "$STAGE/${{ matrix.exe }}" "$STAGE/${{ matrix.capi }}"; do
            echo "Signing $file"
            # --options runtime is Hardened Runtime, which notarization requires.
            # --timestamp is a secure timestamp, also required: without it the
            # signature stops verifying the day the certificate expires.
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$file"
          done

          # The exit code of codesign is not the answer to "is it signed".
          for file in "$STAGE/${{ matrix.exe }}" "$STAGE/${{ matrix.capi }}"; do
            codesign --verify --strict --verbose=2 "$file"
            codesign --display --verbose=2 "$file" 2>&1 | grep -E "Authority|Timestamp|flags" || true
          done

      # The gate. Before this existed, every job in this workflow could go green
      # while shipping an engine that evaluated positions wrongly -- and one did:
      # the linux-aarch64 build published on 2026-07-30 returned WinProb
      # 0.5272137 for the starting position where every x86 build returned
      # 0.5276, because ARM had no vectorized sigmoid and fell back to a lookup
      # table for the whole hidden layer. Nothing here could have noticed. The
      # workflow compiled the code, checked a file existed, zipped it and
      # uploaded it.
      #
      # Run against the STAGED tree, not the build tree, because the staged tree
      # is what users get: it proves the layout, the library beside the binary
      # and the weights all work together, not merely that a compiler succeeded.
      #
      # The e2e asserts numbers -- start position win=0.5276, eq=+0.0819,
      # cf=+0.1045, best 3-1 = 8/5 6/5 at +0.2148, to four decimals -- so a
      # platform computing something subtly different fails here rather than in
      # somebody's match analysis.
      #
      # Python is preinstalled on all three runner images and is a CI referee
      # only; nothing a user installs requires it. Which name it answers to
      # differs, hence the probe: Git Bash on windows-latest has `python` but
      # not always `python3`.
      - name: Prove the staged release evaluates correctly
        run: |
          PY=python3
          command -v "$PY" > /dev/null 2>&1 || PY=python
          command -v "$PY" > /dev/null 2>&1 || {
            echo "::error::no Python on this runner; the release cannot be verified"
            exit 1
          }
          STAGE="stage/$ENGINE_ID"
          "$PY" tests/e2e/run_e2e.py \
            "$STAGE/${{ matrix.exe }}" \
            "$STAGE/${{ matrix.capi }}" \
            "$STAGE/models" \
            "$STAGE/data/bearoff_1sided.db"

      - name: Package and digest
        run: |
          ARCHIVE="$ENGINE_ID-${{ matrix.platform }}.zip"
          # A plain deflate zip, which is what the client's extractor reads.
          # Whichever of the two standard tools the runner image has — and a loud
          # failure if neither, rather than an archive that silently is not one.
          cd "stage/$ENGINE_ID"
          if command -v 7z > /dev/null 2>&1; then
            7z a -tzip -mx=5 "../../$ARCHIVE" . > /dev/null
          elif command -v zip > /dev/null 2>&1; then
            zip -r -9 -q "../../$ARCHIVE" .
          else
            echo "::error::this runner has neither 7z nor zip"
            exit 1
          fi
          cd ../..
          SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          SIZE=$(wc -c < "$ARCHIVE" | tr -d ' ')
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "$ARCHIVE  $SHA  $SIZE bytes"

      # The two documents the site composes the catalogue from. The digest is
      # what lets an install be REFUSED; the command is what stops the client
      # guessing a path into the archive.
      # macOS only. Gatekeeper refuses Developer-ID-signed software that the
      # notary service has not seen, so this is not optional decoration.
      #
      # NOT STAPLED, deliberately and unavoidably: `stapler` attaches tickets to
      # bundles, disk images and installer packages, and a plain Mach-O — which
      # is exactly what this archive contains — cannot carry one. Notarizing the
      # zip still registers each binary's cdhash with Apple, and Gatekeeper
      # validates that over the network. The consequence is narrow and worth
      # stating: a first launch on a Mac with no internet can be refused.
      # Installing an engine requires downloading it, so that window is small —
      # but it is real, and the alternative is reshaping the macOS archive into a
      # .dmg and having one platform's layout differ from the other three.
      #
      # Notarization does not modify the file, so the digest computed above is
      # still the digest of what gets published.
      - name: Notarize the macOS archive
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"

          # 2h, not 30m. The first submission from this Team ID sat at "In
          # Progress" for the full thirty minutes the original value allowed
          # (submission e2dfb804-6af0-478f-a568-f0718ff8ab42, 2026-07-31) --
          # accepted, uploaded, valid, just slow. Apple's queue is unhurried for
          # a new account and typically settles to minutes once it is warm.
          # Both engine repositories are public, so macOS runner minutes are
          # free here and a generous ceiling costs nothing. GitHub's own job
          # limit is 6h, so this stays well inside it.
          LOG="$RUNNER_TEMP/notary.txt"
          xcrun notarytool submit "$ARCHIVE" \
            --key "$KEY" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 2h 2>&1 | tee "$LOG"

          # notarytool's exit code is not a verdict: a submission can be
          # processed successfully and still be Invalid. Read the status.
          STATUS="$(grep -Eo '  status: [A-Za-z]+' "$LOG" | tail -1 | awk '{print $2}')"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization returned '$STATUS' for $ARCHIVE"
            ID="$(grep -Eo '  id: [0-9a-f-]{36}' "$LOG" | head -1 | awk '{print $2}')"
            # The submission SURVIVES this job. notarytool exiting -- on timeout
            # or otherwise -- does not cancel anything; Apple keeps processing and
            # may accept it hours later. Without the id written somewhere durable
            # that acceptance is unreachable, because the log scrolls past and the
            # runner is destroyed. Put it where a person will find it:
            #
            #   xcrun notarytool info <id> --key ... --key-id ... --issuer ...
            #
            # A submission that lands later can then be published by re-running
            # this workflow, rather than the release being lost to a queue.
            {
              echo "### Notarization did not complete: ${{ matrix.platform }}"
              echo
              echo "- archive: \`$ARCHIVE\`"
              echo "- status: **$STATUS**"
              echo "- submission id: \`${ID:-unknown}\`"
              echo
              echo "Apple is still processing this. Check it with:"
              echo '```'
              echo "xcrun notarytool info ${ID:-<id>} --key AuthKey.p8 --key-id <key-id> --issuer <issuer>"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$ID" ]; then
              echo "--- notary log ---"
              xcrun notarytool log "$ID" \
                --key "$KEY" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            fi
            rm -f "$KEY"
            exit 1
          fi
          rm -f "$KEY"
          echo "Notarized $ARCHIVE"

      - name: Write the manifests
        run: |
          cat > identity.json <<JSON
          {
            "id": "$ENGINE_ID",
            "name": "Open Sage",
            "description": "GammonBase's house engine. Nineteen neural networks with a backgame-aware pair strategy, plus a one-sided bearoff database.",
            "licence": "AGPL-3.0-or-later",
            "sourceUrl": "https://github.com/customation/bgsage"
          }
          JSON
          cat > release.json <<JSON
          {
            "version": "$VERSION",
            "platform": "${{ matrix.platform }}",
            "file": "$ARCHIVE",
            "sha256": "$SHA256",
            "sizeBytes": $SIZE,
            "command": "${{ matrix.exe }}",
            "args": [],
            "instances": 2
          }
          JSON
          cat identity.json release.json

      # The archive FIRST, then the manifest that publishes it: the catalogue is
      # composed from the manifests, so a release becomes visible only once the
      # thing it describes is actually downloadable.
      - name: Publish to object storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::SCW_OBJECT_STORAGE_ACCESS_KEY / _SECRET_KEY are not set on this repository."
            exit 1
          fi
          BASE="s3://$S3_BUCKET/$ENGINES_PREFIX/$ENGINE_ID"
          RELEASE="$BASE/$VERSION/${{ matrix.platform }}"
          aws s3 cp "$ARCHIVE" "$RELEASE/$ARCHIVE" --endpoint-url "$S3_ENDPOINT" --content-type application/zip
          aws s3 cp release.json "$RELEASE/release.json" --endpoint-url "$S3_ENDPOINT" --content-type application/json
          aws s3 cp identity.json "$BASE/identity.json" --endpoint-url "$S3_ENDPOINT" --content-type application/json
          echo "Published $ENGINE_ID $VERSION (${{ matrix.platform }})"

      # A new version supersedes the old one. Anything left behind is an
      # unreachable copy that still costs storage, still appears to anyone
      # listing the bucket, and -- the reason this matters -- is still
      # DOWNLOADABLE. A superseded build is often superseded precisely because
      # it was wrong.
      #
      # Scoped to THIS PLATFORM, which is the whole design. Jobs here are
      # fail-fast: false and publish independently, so a blanket "delete every
      # other version" would let a successful windows job delete the last
      # working linux-aarch64 build at the moment aarch64 failed its gate --
      # turning one platform's bad release into another platform's outage.
      # Deleting only engines/<id>/<version>/<platform>/ means a platform that
      # never got here never loses what it already had.
      #
      # identity.json cannot be caught by this: it sits at
      # engines/<id>/identity.json, and listing with a delimiter returns
      # CommonPrefixes -- directories only -- so a key at that level is not in
      # the result set at all. Written so it cannot see the file, rather than
      # seeing it and being careful.
      #
      # `tr -d '\r'` is not decoration. This job runs on windows-latest too, the
      # keys arrive with carriage returns, and a key ending in one matches no
      # guard and names no object -- so every guard silently fails open while
      # every delete silently targets a key that does not exist. S3 reports
      # success for deleting a nonexistent key, so the log reads "delete:" for
      # objects never touched.
      - name: Remove superseded builds for this platform
        env:
          # `--delimiter /` is a bare slash, and Git Bash on windows-latest
          # rewrites that to C:/Program Files/Git/ before aws ever sees it -- so
          # the listing matched nothing, the loop never ran, and the Windows
          # prune silently did nothing while both Linux jobs pruned correctly.
          # Ignored on Linux, where the variable means nothing.
          MSYS_NO_PATHCONV: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          BASE="$ENGINES_PREFIX/$ENGINE_ID"
          PLATFORM="${{ matrix.platform }}"

          # 1. Stale files beside this release -- an earlier build of the same
          #    version published under a different archive name.
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" \
            --prefix "$BASE/$VERSION/$PLATFORM/" \
            --endpoint-url "$S3_ENDPOINT" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | tr -d '\r' \
            | while read -r key; do
                case "$key" in
                  "" | None) continue ;;
                  "$BASE/$VERSION/$PLATFORM/$ARCHIVE" | "$BASE/$VERSION/$PLATFORM/release.json") continue ;;
                esac
                echo "Removing stale $key"
                aws s3 rm "s3://$S3_BUCKET/$key" --endpoint-url "$S3_ENDPOINT"
              done

          # 2. This platform's directory under every OTHER version.
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" \
            --prefix "$BASE/" --delimiter / \
            --endpoint-url "$S3_ENDPOINT" --query 'CommonPrefixes[].Prefix' --output text \
            | tr '\t' '\n' | tr -d '\r' \
            | while read -r vprefix; do
                case "$vprefix" in
                  "" | None | "$BASE/$VERSION/") continue ;;
                esac
                echo "Removing superseded ${vprefix}${PLATFORM}/"
                aws s3 rm "s3://$S3_BUCKET/${vprefix}${PLATFORM}/" --recursive --endpoint-url "$S3_ENDPOINT"
              done

      # A release is published only if what the catalogue is composed from is
      # still there when the job ends. Every step above reports success on its
      # own terms, including a delete that "worked" against a key that never
      # existed. This is the only step that asks the question a user asks: can
      # the thing be downloaded?
      - name: Verify this platform's release survived
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          BASE="$ENGINES_PREFIX/$ENGINE_ID"
          PLATFORM="${{ matrix.platform }}"
          for key in "$BASE/identity.json" \
                     "$BASE/$VERSION/$PLATFORM/release.json" \
                     "$BASE/$VERSION/$PLATFORM/$ARCHIVE"; do
            if ! aws s3api head-object --bucket "$S3_BUCKET" --key "$key" \
                 --endpoint-url "$S3_ENDPOINT" > /dev/null 2>&1; then
              echo "::error::$key is missing after publishing -- the catalogue would offer a file that is not there"
              exit 1
            fi
            echo "present: $key"
          done
